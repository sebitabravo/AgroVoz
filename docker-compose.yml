# AgroVoz — Docker Compose para DESARROLLO LOCAL
#
# Levanta backend FastAPI + Open-WA (gateway WhatsApp).
# Usa .env para variables de entorno.
#
# Requisito: .env existe. Si no, ejecutá 'make setup-env'.
#
# Comandos:
#   docker compose up -d              # Levantar todo
#   docker compose up -d backend      # Solo backend
#   docker compose logs -f            # Ver logs
#   docker compose down               # Bajar todo

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - HOST=0.0.0.0
      - PORT=8000
      - OPENWA_API_URL=http://openwa:2785
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/data:/app/data        # SQLite DB + audio temporal (persiste entre reinicios)
      - ./backend/models:/app/models    # Modelos IA (persisten entre reinicios)
      - ./backend/models/whisper-cache:/home/agrovoz/.cache/whisper  # Cache Whisper (evita descargar 461MB cada vez)
      - ./backend/app:/app/app          # Hot reload: montar código fuente
      # Migraciones montadas: sin esto la imagen queda con el set de migraciones
      # del último build y el schema de la DB deriva del de los modelos
      # (ej: "no such column: user_prefs.cultivos" con imagen vieja).
      - ./backend/migrations:/app/migrations
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health?probe=liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Open-WA: gateway WhatsApp self-hosted (protocolo WhatsApp Web)
  # API y dashboard comparten el puerto 2785 (single-port, v0.4.0+).
  # La imagen escucha en puerto 2785 internamente (ya no 8000).
  # API + Dashboard: http://localhost:2785 (API) y http://localhost:2785/ (dashboard SPA).
  # Backend se conecta a http://openwa:2785 (red Docker interna).
  # Puerto bindeado solo a localhost por seguridad.
  #
  # API_MASTER_KEY: seed de API key inicial (SOLO primer arranque, DB vacía).
  #   ${OPENWA_API_KEY:-dev-admin-key}: usa el valor de .env si existe,
  #   o dev-admin-key como fallback determinístico para desarrollo.
  #   Para usar una key custom, definí OPENWA_API_KEY en tu .env (sin editar este archivo).
  # AUTO_START_SESSIONS: reconecta sesiones WhatsApp previas al reiniciar el contenedor.
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_TYPE=sqlite
      - API_MASTER_KEY=${OPENWA_API_KEY:-dev-admin-key}
      - ALLOW_DEV_API_KEY=true
      - AUTO_START_SESSIONS=true
      - WEBHOOK_SSRF_PROTECT=false   # Desactivado para desarrollo local (Docker internal)
      - WEBHOOK_URL=http://backend:8000/api/v1/webhook/whatsapp
      - WEBHOOK_SECRET=${OPENWA_WEBHOOK_SECRET:-dev-webhook-secret}
    ports:
      - "127.0.0.1:2785:2785"          # API + Dashboard — imagen escucha en 2785 internamente
    volumes:
      - openwa_data:/app/data           # Sesión WhatsApp persiste entre reinicios
    healthcheck:
      # curl no está garantizado en la imagen Open-WA (basada en Node.js).
      # Usamos node -e con http.get para healthcheck sin dependencias externas.
      # Open-WA escucha en puerto 2785 internamente (v0.4.0+).
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2785/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Spike IVR local (#172). No expone SIP ni PSTN y no se despliega en
  # producción: un DID chileno entrante agrega costo recurrente.
  # Uso: docker compose --profile ivr up -d ivr
  ivr:
    profiles: ["ivr"]
    build:
      context: ./ivr
      dockerfile: Dockerfile
    restart: "no"
    environment:
      # Credencial ARI del puente local (C10, #172). Solo alcanzable dentro
      # de la red interna de Compose: este servicio no publica puertos.
      - IVR_ARI_PASSWORD=${IVR_ARI_PASSWORD:?IVR_ARI_PASSWORD requerida para habilitar ARI — ver .env.example}
    volumes:
      - ./backend/data/ivr:/usr/share/asterisk/sounds/agrovoz:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  openwa_data:
