# AgroVoz — Docker Compose para DESARROLLO LOCAL
#
# Levanta backend FastAPI + Open-WA (gateway WhatsApp).
# Usa .env para variables de entorno.
#
# Comandos:
#   docker compose up -d              # Levantar todo
#   docker compose up -d backend      # Solo backend
#   docker compose logs -f            # Ver logs
#   docker compose down               # Bajar todo

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"                   # Dev: expuesto en host para debug y curl
    volumes:
      - ./backend/data:/app/data      # SQLite DB + audio temporal (persiste entre reinicios)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Open-WA: gateway WhatsApp self-hosted (protocolo WhatsApp Web)
  # Dashboard en puerto 2886 para escanear QR (primera vez).
  # API interna en puerto 2785 (el backend se conecta a este).
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_PROVIDER=sqlite
      - API_KEY=${OPENWA_API_KEY:-dev-api-key}
      - WEBHOOK_URL=http://backend:8000/api/v1/webhook/whatsapp
      - WEBHOOK_SECRET=${OPENWA_WEBHOOK_SECRET:-dev-webhook-secret}
    ports:
      - "2886:2886"                   # Dashboard (escanear QR: http://localhost:2886)
      - "2785:2785"                   # API interna
    volumes:
      - openwa_data:/app/data         # Sesión WhatsApp persiste entre reinicios
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openwa_data:
