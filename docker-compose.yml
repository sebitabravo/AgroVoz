# AgroVoz — Docker Compose para DESARROLLO LOCAL
#
# Levanta backend FastAPI + Open-WA (gateway WhatsApp).
# Usa .env para variables de entorno.
#
# Requisito: .env existe. Si no, ejecutá 'make setup-env'.
#
# Comandos:
#   docker compose up -d              # Levantar todo
#   docker compose up -d backend      # Solo backend
#   docker compose logs -f            # Ver logs
#   docker compose down               # Bajar todo

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - OPENWA_API_URL=http://openwa:8000
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data        # SQLite DB + audio temporal (persiste entre reinicios)
      - ./backend/models:/app/models    # Modelos IA (persisten entre reinicios)
      - ./backend/app:/app/app          # Hot reload: montar código fuente
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health?probe=liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Open-WA: gateway WhatsApp self-hosted (protocolo WhatsApp Web)
  # Dashboard en puerto 2886 (host) → 8000 (contenedor) para escanear QR.
  # API interna mapeada a 2785 (host) → 8000 (contenedor).
  # Backend se conecta directamente a http://openwa:8000 (red Docker interna).
  # Ambos puertos bindeados solo a localhost por seguridad.
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_PROVIDER=sqlite
      - API_KEY=${OPENWA_API_KEY:-8d83df90-24ff-4fd7-b2d1-1fa5fcec51d9}
      - WEBHOOK_URL=http://backend:8000/api/v1/webhook/whatsapp
      - WEBHOOK_SECRET=${OPENWA_WEBHOOK_SECRET:-a50334f5-1087-48c1-89b1-acf2079a0f15}
    ports:
      - "127.0.0.1:2886:8000"          # Dashboard (solo localhost, escanear QR)
      - "127.0.0.1:2785:8000"          # API interna (solo localhost)
    volumes:
      - openwa_data:/app/data           # Sesión WhatsApp persiste entre reinicios
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # curl no está garantizado en la imagen Open-WA (basada en Node.js).
      # Usamos node -e con http.get para healthcheck sin dependencias externas.
      # Open-WA escucha en puerto 8000 (POR defecto de la imagen).
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openwa_data:
