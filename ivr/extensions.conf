[general]
static=yes
writeprotect=yes
clearglobalvars=yes

; Flujo local mínimo de respaldo (#172).
; No expone SIP/PSTN: se prueba con un canal Local desde la CLI de Asterisk.
[agrovoz-local]
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Playback(agrovoz/precio-papa)
 same => n,Hangup()

; VAD, streaming y barge-in (C10, #172): la extensión 601 entrega el canal
; a la app Stasis "agrovoz-ivr", controlada por scripts/ivr_ari_bridge.py vía
; ARI. Sin Stasis no hay forma de recibir ChannelTalkingStarted/Finished ni
; de cortar una reproducción en curso — ver docs/spike-ivr.md.
exten => 601,1,Stasis(agrovoz-ivr)
 same => n,Hangup()
