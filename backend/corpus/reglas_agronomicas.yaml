# Corpus de reglas agronómicas citadas (C1+C2, hard constraint de AGENTS.md).
#
# El LLM NUNCA improvisa un consejo agronómico. Cada regla resuelve
# determinísticamente una consulta específica desde un hecho ya verificado
# en corpus/inia_papa.yaml, sin parafrasear ni inventar contenido nuevo.
# Si no hay una regla que calce, el sistema dice que no tiene el dato — no
# rellena con una respuesta genérica.
#
# Formato de vigencia igual al de indap_creditos.yaml: verificado_el /
# revisar_antes_de. Si el snapshot vence, el motor falla cerrado.
#
# Auditoría de contenido 30/07/2026: re-verificado contra fuentes primarias
# (enfermedadespapa.inia.cl para tizón; INIA/CIREN para época de siembra
# regional; ODEPA/INE para rendimiento) tras detectar que la transcripción
# original tenía el rango de temperatura del tizón incorrecto, síntomas
# tempranos faltantes, la ventana de siembra temprana de Araucanía costera
# ausente, y una cita de fuente sin URL rastreable. `fuente_url` ahora es
# obligatorio en cada regla — nunca más una fuente sin cómo verificarla.
version: 1
verificado_el: "2026-07-30"
revisar_antes_de: "2027-01-30"
reglas:
  - id: "papa_tizon_tardio"
    cultivo: "papa"
    sintomas:
      - "manchas marrones en las hojas"
      - "manchas en las hojas"
      - "hojas con manchas"
      - "pudre el tuberculo"
      - "se pudre la papa"
      - "hojas manchadas"
      - "manchas verde oscuro en las hojas"
      - "manchas acuosas en las hojas"
      - "borde amarillo en las hojas"
      - "halo amarillo en la mancha"
      - "pelusa blanca bajo la hoja"
    fuente: "INIA Chile — Enfermedades de la papa: Tizón tardío"
    fuente_url: "https://enfermedadespapa.inia.cl/tizonTardio.php"
    fecha: "2026-07-30"
    diagnostico: >
      Según INIA, el tizón tardío (Phytophthora infestans) es la enfermedad
      más importante del cultivo de papa en Chile. Es una enfermedad
      policíclica que se presenta con humedad relativa sobre 80% y
      temperaturas entre 15°C y 25°C, con máxima velocidad de avance cerca
      de 21°C. Los primeros síntomas aparecen en los bordes de las hojas
      inferiores como manchas acuosas de color verde oscuro a café,
      limitadas por un halo amarillo pálido; con humedad alta se expanden
      formando zonas café atizonadas irregulares y pueden pudrir el
      tubérculo. Ningún fungicida cura una infección ya establecida: las
      aplicaciones son preventivas.
    siguiente_paso: "Consulta a tu agrónomo PRODESAL o a INDAP para definir un tratamiento."

  - id: "papa_epoca_siembra"
    cultivo: "papa"
    sintomas:
      - "cuando planto"
      - "cuando siembro"
      - "epoca de siembra"
      - "epoca de plantacion"
      - "cuando puedo sembrar"
    fuente: "INIA Chile — Manual del cultivo de la Papa en Chile"
    fuente_url: "https://biblioteca.inia.cl/handle/20.500.14001/6706"
    fecha: "2026-07-30"
    diagnostico: >
      Según INIA, en la Región de La Araucanía se distinguen tres épocas de
      plantación de papa: temprana (julio a agosto, en las comunas de
      Carahue y Saavedra y el borde costero, bajo condición de secano),
      media estación (agosto) y la época principal, de primavera (fines de
      septiembre a noviembre). La papa requiere suelos profundos, bien
      drenados y con pH entre 5.0 y 6.5.
    siguiente_paso: null

  - id: "papa_rotacion_cultivos"
    cultivo: "papa"
    sintomas:
      - "rotacion de cultivos"
      - "que sembre antes"
      - "despues de que cultivo"
      - "que cultivo va antes"
    fuente: "INIA Chile — Manual del cultivo de la Papa en Chile"
    fuente_url: "https://biblioteca.inia.cl/handle/20.500.14001/6706"
    fecha: "2026-07-30"
    diagnostico: >
      INIA recomienda rotación de cultivos cada 3-4 años para prevenir
      enfermedades del suelo. Los cultivos que anteceden a la papa no deben
      ser solanáceas (tomate, ají, berenjena). Cultivos como cereales,
      leguminosas o praderas son adecuados como antecesores.
    siguiente_paso: null

  - id: "papa_epoca_cosecha"
    cultivo: "papa"
    sintomas:
      - "cuando cosecho"
      - "esta lista la papa"
      - "cuando se cosecha"
      - "cuando sacar la papa"
    fuente: "INIA Chile — Manual del cultivo de la Papa en Chile"
    fuente_url: "https://biblioteca.inia.cl/handle/20.500.14001/6706"
    fecha: "2026-07-30"
    diagnostico: >
      La cosecha de papa se realiza cuando el follaje se ha secado
      completamente. En la Región de La Araucanía, la papa temprana de
      secano (borde costero) tiene un ciclo de 110 a 120 días con
      rendimientos de 15 a 25 toneladas por hectárea. El rendimiento
      promedio nacional (INE/ODEPA) es de 29,2 toneladas por hectárea; con
      riego tecnificado puede llegar hasta 80 toneladas por hectárea.
    siguiente_paso: null
