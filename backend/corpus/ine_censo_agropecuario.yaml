    chunks:
      - "El VIII Censo Agropecuario y Forestal entrega resultados y tablas para describir la actividad silvoagropecuaria de Chile a escala nacional, regional y comunal."
      - "El portal oficial del INE publica bases de datos, diccionarios de variables, metodología y visualizaciones; AgroVoz verifica el catálogo de archivos sin descargar las bases masivas durante el arranque."
      - "Los datos censales son una línea base estadística y no deben presentarse como precio actual, pronóstico meteorológico ni recomendación agronómica personalizada."
