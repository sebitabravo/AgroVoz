# Snapshot público para issue #246.
#
# Las sedes INDAP se verificaron contra la página regional el 03/08/2026.
# El registro de cooperativas de datos.gob.cl declara como última actualización
# el 25/01/2013 y por eso la respuesta pide confirmar vigencia antes de viajar.
# El plan regional de INDAP solo acredita presencia de PRODESAL por comuna; no
# publica teléfonos ni direcciones de esas oficinas, así que esos campos quedan
# ausentes en vez de completar datos no respaldados.
# Política del servicio: un registro solo entrega dirección/teléfono si la fuente
# declara una fecha válida dentro de 180 días y el snapshot fue verificado dentro
# de 90 días. Si la fuente no tiene fecha (como INDAP), es antigua o inválida,
# la respuesta muestra solo la advertencia y el enlace oficial (fail-closed).
