# Calendario agrícola citado de INIA Carillanca (issue #244).
#
# Este snapshot conserva únicamente ventanas transcritas desde las fichas
# técnico-económicas públicas de Plan Predial. No se completan cultivos con
# promedios ni se extrapolan fechas entre zonas agroecológicas: cuando no
# existe una fila verificable para la comuna solicitada, el servicio falla
# cerrado y dice que no tiene el dato.
# Cobertura verificable de este snapshot: 22 fichas; 21 corresponden al secano
# interior del piloto Traiguén y una ficha de papa declara las zonas cubiertas
# por la propia tabla como "todas". El resto del catálogo de 79 cultivos queda
# explícitamente sin regla hasta contar con una fuente INIA comprobada.
