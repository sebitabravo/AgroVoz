version: 1
verificado_el: "2026-07-29"
revisar_antes_de: "2026-08-28"
documentos:
  - id: "credito_corto_plazo"
    titulo: "Crédito Corto Plazo"
    fuente: "INDAP Chile — Crédito Corto Plazo"
    fuente_url: "https://www.indap.gob.cl/plataforma-de-servicios/credito-corto-plazo"
    fecha: "2026-07-29"
    chunks:
      - texto: >
          Según INDAP, el Crédito de Corto Plazo financia total o
          parcialmente capital de trabajo para actividades
          silvoagropecuarias, con un plazo máximo de 359 días. La solicitud
          puede iniciarse durante todo el año en una Agencia de Área o
          mediante Mi INDAP.

  - id: "credito_largo_plazo"
    titulo: "Crédito Largo Plazo"
    fuente: "INDAP Chile — Crédito Largo Plazo"
    fuente_url: "https://www.indap.gob.cl/plataforma-de-servicios/credito-largo-plazo"
    fecha: "2026-07-29"
    chunks:
      - texto: >
          Según INDAP, el Crédito de Largo Plazo financia total o
          parcialmente inversiones y el capital de trabajo definido en el
          proyecto, con plazos desde 360 días hasta 10 años. La solicitud
          puede iniciarse durante todo el año en una Agencia de Área o
          mediante Mi INDAP.

  - id: "programa_desarrollo_inversiones"
    titulo: "Programa de Desarrollo de Inversiones"
    fuente: "INDAP Chile — Programa de Desarrollo de Inversiones"
    fuente_url: "https://www.indap.gob.cl/plataforma-de-servicios/programa-desarrollo-de-inversiones-pdi"
    fecha: "2026-07-29"
    chunks:
      - texto: >
          Según INDAP, el Programa de Desarrollo de Inversiones, PDI, es un
          incentivo económico no reembolsable para cofinanciar inversiones
          productivas. No es un crédito. Cada Dirección Regional determina
          sus períodos y requisitos específicos de postulación.

  - id: "acreditacion_indap"
    titulo: "Requisitos para ser usuario o usuaria de INDAP"
    fuente: "INDAP Chile — Acreditación de usuarios"
    fuente_url: "https://www.indap.gob.cl/requisitos-para-ser-usuarioa-de-indap"
    fecha: "2026-07-29"
    chunks:
      - texto: >
          Según INDAP, la acreditación como usuario o usuaria permite
          postular a sus servicios, pero no garantiza el acceso a un crédito
          o incentivo. INDAP debe revisar los requisitos específicos y la
          disponibilidad del instrumento solicitado.
