# Corpus INIA — Fichas técnicas de cultivo
#
# Auditoría de contenido 30/07/2026: los 5 hechos de este corpus fueron
# re-verificados contra fuentes primarias INIA/ODEPA/INE tras detectar
# errores en la transcripción original (rango de temperatura del tizón,
# ventana de siembra incompleta para Araucanía costera, síntomas tempranos
# faltantes, superficie nacional y atribución de rendimiento). Cada chunk
# cita ahora la fuente específica verificada, no una "ficha técnica"
# genérica sin URL.
documentos:
  - titulo: "Manual del cultivo de la Papa en Chile — INIA Chile"
    fuente: "INIA Chile — Manual del cultivo de la Papa en Chile"
    fecha: "2026-07-30"
    chunks:
      - texto: >
          Según INIA, la papa (Solanum tuberosum) es el cuarto cultivo
          alimenticio más importante del mundo. En Chile se cultivan
          anualmente cerca de 50.000 hectáreas de papa, concentradas
          principalmente en la provincia de Arauco (Región del Biobío) y
          en las regiones de La Araucanía, Los Ríos y Los Lagos — el
          promedio de la última década (ODEPA/INE) ronda las 43.000
          hectáreas. Las variedades más comunes son Desiree, Asterix,
          Patagonia-INIA, Karú-INIA y Yagana.
      - texto: >
          El tizón tardío (Phytophthora infestans) es la enfermedad más
          importante del cultivo de papa en Chile, según INIA. Es una
          enfermedad policíclica que se presenta con humedad relativa
          sobre 80% y temperaturas entre 15°C y 25°C, con máxima velocidad
          de avance cerca de 21°C. Los primeros síntomas aparecen en los
          bordes de las hojas inferiores como manchas acuosas de color
          verde oscuro a café, limitadas por un halo amarillo pálido; con
          humedad alta se expanden formando zonas café atizonadas
          irregulares y pueden pudrir el tubérculo.
      - texto: >
          Según INIA, en la Región de La Araucanía se distinguen tres
          épocas de plantación de papa: temprana (julio a agosto, en las
          comunas de Carahue y Saavedra y el borde costero, cerca del 10%
          de la producción regional, bajo condición de secano), media
          estación (agosto) y la época principal, de primavera (fines de
          septiembre a noviembre). La papa requiere suelos profundos, bien
          drenados y con pH entre 5.0 y 6.5.
      - texto: >
          INIA recomienda rotación de cultivos cada 3-4 años para prevenir
          enfermedades del suelo. Los cultivos que anteceden a la papa no
          deben ser solanáceas (tomate, ají, berenjena). Cultivos como
          cereales, leguminosas o praderas son adecuados como antecesores.
      - texto: >
          La cosecha de papa se realiza cuando el follaje se ha secado
          completamente. En la Región de La Araucanía, la papa temprana de
          secano (borde costero) tiene un ciclo de 110 a 120 días con
          rendimientos de 15 a 25 toneladas por hectárea. El rendimiento
          promedio nacional (INE/ODEPA) es de 29,2 toneladas por hectárea;
          con riego tecnificado puede llegar hasta 80 toneladas por
          hectárea.
