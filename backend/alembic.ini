# Alembic — gestión de migraciones para AgroVoz
#
# Uso:
#   cd backend
#   uv run alembic revision --autogenerate -m "descripcion"
#   uv run alembic upgrade head
#   uv run alembic downgrade -1
#
# En producción (Docker), la URL se sobreescribe con variable de entorno:
#   DATABASE_URL=sqlite:///data/agrovoz.db

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# La URL real viene de pydantic-settings vía env.py (no de alembic.ini).
# Esto permite que .env sobreescriba el path de la DB sin tocar este archivo.
sqlalchemy.url = sqlite:///data/agrovoz.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
