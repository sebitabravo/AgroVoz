<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgroVoz — Console de agrónomos</title>
  <meta name="description" content="Resumen operativo de los productores de tu grupo PRODESAL." />
  <link rel="icon" href="/static/favicon.svg" />
  <meta name="theme-color" content="#4f7d5a" />
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1.5rem;
      background: #fbfaf7;
      color: #1f2a20;
    }
    main { max-width: 48rem; margin: 0 auto; }
    h1 { font-size: 1.25rem; color: #4f7d5a; }
    .card {
      background: #fff;
      border: 1px solid #e2ddd0;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .card h2 { font-size: 0.95rem; margin: 0 0 0.5rem; }
    .muted { color: #6b6b6b; font-size: 0.875rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #e2ddd0; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Console de agrónomos — AgroVoz</h1>
    <div id="contenido">
      <p class="muted">Cargando…</p>
    </div>
  </main>
  <script src="/static/agronomo/app.js"></script>
</body>
</html>
