<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgroVoz — Mi resumen</title>
  <meta name="description" content="Tu resumen de AgroVoz: comuna, cultivos, parcelas y alertas." />
  <link rel="manifest" href="/static/panel/manifest.json" />
  <link rel="icon" href="/static/favicon.svg" />
  <meta name="theme-color" content="#4f7d5a" />
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1.5rem;
      background: #fbfaf7;
      color: #1f2a20;
    }
    main { max-width: 32rem; margin: 0 auto; }
    h1 { font-size: 1.25rem; color: #4f7d5a; }
    .card {
      background: #fff;
      border: 1px solid #e2ddd0;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .card h2 { font-size: 0.95rem; margin: 0 0 0.5rem; }
    .muted { color: #6b6b6b; font-size: 0.875rem; }
    #estado-offline {
      display: none;
      background: #fff4e0;
      border: 1px solid #e0c070;
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
    }
    .camera-preview {
      position: relative;
      aspect-ratio: 4 / 3;
      width: 100%;
      overflow: hidden;
      border-radius: 0.5rem;
      background: #172019;
      color: #fff;
      display: grid;
      place-items: center;
      margin-bottom: 0.75rem;
    }
    .camera-preview video,
    .camera-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-preview video[hidden],
    .camera-preview img[hidden] {
      display: none;
    }
    .camera-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .camera-actions button {
      min-height: 2.75rem;
      flex: 1 1 10rem;
      border: 0;
      border-radius: 0.5rem;
      padding: 0.625rem 0.75rem;
      background: #4f7d5a;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .camera-actions button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .camera-status {
      min-height: 1.25rem;
      margin: 0.75rem 0 0;
    }
    .vision-result {
      margin-top: 0.75rem;
      border-top: 1px solid #e2ddd0;
      padding-top: 0.75rem;
    }
    .vision-result p { margin: 0.35rem 0; }
    .vision-result a { color: #315d3b; }
  </style>
</head>
<body>
  <main>
    <h1>Mi resumen — AgroVoz</h1>
    <p id="estado-offline">Sin conexión: mostrando el último resumen guardado en este dispositivo.</p>
    <div id="contenido">
      <p class="muted">Cargando…</p>
    </div>
    <section id="identificar-plaga" class="card" aria-labelledby="titulo-identificar-plaga">
      <h2 id="titulo-identificar-plaga">Identificar plaga</h2>
      <p class="muted">Toma una foto de la hoja para consultar la identificación visual.</p>
      <div class="camera-preview" aria-live="polite">
        <video id="visor-camara" autoplay playsinline muted hidden aria-label="Vista previa de la cámara"></video>
        <canvas id="captura-camara" hidden></canvas>
        <img id="imagen-anotada" hidden alt="Resultado visual de la identificación" />
        <span id="estado-visor">Presiona «Usar cámara» para comenzar.</span>
      </div>
      <div class="camera-actions">
        <button id="activar-camara" type="button">Usar cámara</button>
        <button id="capturar-imagen" type="button" disabled>Capturar y analizar</button>
      </div>
      <p id="estado-camara" class="muted camera-status" role="status"></p>
      <div id="resultado-vision" class="vision-result" hidden aria-live="polite">
        <p><strong>Identificación:</strong> <span id="vision-enfermedad"></span></p>
        <p><strong>Confianza:</strong> <span id="vision-confianza"></span></p>
        <p><strong>Fuente INIA:</strong> <span id="vision-fuente"></span></p>
        <p id="vision-fecha" class="muted"></p>
      </div>
    </section>
  </main>
  <script src="/static/panel/app.js"></script>
  <script src="/static/panel/register-sw.js"></script>
</body>
</html>
