# AgroVoz — Dependabot version updates + cooldown anti supply-chain attacks
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:

  # ── Backend Python (uv + pyproject.toml) ──
  # NOTA: pyproject.toml no existe aún (etapa IDEA). Dependabot ignora esta
  # entrada sin fallar hasta que el manifiesto aparezca (fase 01). Mismo patrón
  # que CI self-gated: configurar ahora, se activa solo cuando el código llega.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - mod:backend
    groups:
      dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch
      fastapi-ecosystem:
        patterns:
          - fastapi
          - uvicorn
          - starlette
          - pydantic*
          - sqlalchemy
          - alembic
      ai-ml:
        patterns:
          - openai-whisper
          - llama-cpp-python
          - piper-tts

  # ── Frontend Astro (npm/bun) ──
  # NOTA: package.json no existe aún (etapa IDEA). Misma lógica que backend:
  # Dependabot ignora esta entrada hasta que landing/package.json aparezca.
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - mod:landing
    groups:
      astro-ecosystem:
        patterns:
          - astro
          - "@astrojs/*"
          - tailwindcss
          - "@tailwindcss/*"
      dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch

  # ── Backend Dockerfile ──
  # NOTA: Dockerfile no existe aún (etapa IDEA). Dependabot ignora esta entrada
  # sin fallar hasta que backend/Dockerfile aparezca (fase 01).
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - mod:backend
      - docker

  # ── GitHub Actions — workflows ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - actions/*
          - astral-sh/*
          - oven-sh/*
