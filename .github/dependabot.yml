# Dependabot — actualizaciones automáticas de dependencias.
# Adaptado de OpenWA. Agrega cooldown (hardening supply chain, ver CLAUDE.md global npm-security).
version: 2
updates:
  # Backend Python (FastAPI, Whisper, llama-cpp-python, httpx, etc.)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3   # evitar versiones recién publicadas (vector de supply chain)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
    labels:
      - dependencies
      - backend

  # Landing Astro (package.json bajo landing/)
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
    labels:
      - dependencies
      - landing

  # GitHub Actions (workflows)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - ci
