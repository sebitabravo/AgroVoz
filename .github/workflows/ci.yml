# CI de AgroVoz. Inspirado en OpenWA, adaptado al stack Python + Astro + Open-WA.
# Ejecuta lint, type-check, tests del backend y build de la landing en cada push/PR a main.
#
# Jobs self-gateados: cada job verifica si su manifiesto (pyproject.toml, package.json,
# docker-compose.yml) existe antes de ejecutar. Si no existe, el gate step setea un output
# y los steps siguientes se saltan vía `if:`. El job sale verde sin hacer nada.
# Esto permite que los checks sean REQUIRED en el ruleset sin bloquear PRs pre-fase.
# Cuando el manifiesto aparece (al iniciar la fase), el job se activa automáticamente.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs anteriores de la misma rama (ahorra minutos de Actions).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ── Backend: lint + type-check ──
  # Self-gated vía output. Steps posteriores al gate usan:
  #   if: steps.gate.outputs.skip != 'true'
  # El exit 0 NO detiene el job en GitHub Actions — solo el step actual.
  lint:
    name: Backend lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Gate — skip si backend no inicializado
        id: gate
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "⏭️  Backend aún no inicializado (sin pyproject.toml). Nada que lint-ear."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # setup-uv v9 cambió el default de prune-cache a false, lo que engorda
          # el cache de Actions y sube el costo. Se fija explícito al valor que
          # traía v8 para que el bump no cambie el gasto.
          prune-cache: true

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: uv sync --extra heavy --dev

      - name: Ruff (lint + format check)
        if: steps.gate.outputs.skip != 'true'
        run: uv run ruff check app/

      - name: mypy (strict)
        if: steps.gate.outputs.skip != 'true'
        run: uv run mypy app/

  # ── Backend: tests ──
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Gate — skip si backend no inicializado
        id: gate
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "⏭️  Backend aún no inicializado (sin pyproject.toml). Nada que testear."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # setup-uv v9 cambió el default de prune-cache a false, lo que engorda
          # el cache de Actions y sube el costo. Se fija explícito al valor que
          # traía v8 para que el bump no cambie el gasto.
          prune-cache: true

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: uv sync --extra heavy --dev

      - name: pytest
        if: steps.gate.outputs.skip != 'true'
        run: uv run pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: backend/.coverage*
          retention-days: 7

  # ── Backend: E2E tests contra API real ──
  # Corre solo si AGROVOZ_E2E_BASE_URL está seteado en GitHub Actions secrets/vars.
  # Si no está configurado, el gate skipea y el job sale verde (no blocker).
  e2e:
    name: Backend E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Gate — skip si backend no inicializado o E2E_BASE_URL no configurado
        id: gate
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "⏭️  Backend aún no inicializado (sin pyproject.toml). Nada que testear."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ secrets.AGROVOZ_E2E_BASE_URL }}" ] && [ -z "${{ vars.AGROVOZ_E2E_BASE_URL }}" ]; then
            echo "⏭️  AGROVOZ_E2E_BASE_URL no configurado (ni secret ni var). Omitiendo tests E2E."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # setup-uv v9 cambió el default de prune-cache a false, lo que engorda
          # el cache de Actions y sube el costo. Se fija explícito al valor que
          # traía v8 para que el bump no cambie el gasto.
          prune-cache: true

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: uv sync --extra heavy --dev

      - name: pytest (E2E)
        if: steps.gate.outputs.skip != 'true'
        env:
          AGROVOZ_E2E_BASE_URL: ${{ secrets.AGROVOZ_E2E_BASE_URL || vars.AGROVOZ_E2E_BASE_URL }}
          AGROVOZ_E2E_ADMIN_KEY: ${{ secrets.AGROVOZ_E2E_ADMIN_KEY || vars.AGROVOZ_E2E_ADMIN_KEY }}
        run: uv run pytest tests/e2e/ -v -m "e2e"

  # ── Landing: build Astro ──
  landing:
    name: Landing build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Gate — skip si landing no inicializada
        id: gate
        run: |
          if [ ! -f package.json ]; then
            echo "⏭️  Landing aún no inicializada (sin package.json). Nada que build-ear."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup bun
        if: steps.gate.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Test
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 10
        run: bun run test

      - name: Build
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 10
        run: bun run build

  # ── Docker: validar compose ──
  compose-check:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Gate — skip si compose no inicializado
        id: gate
        run: |
          if [ ! -f docker-compose.yml ]; then
            echo "⏭️  Docker Compose aún no configurado. Nada que validar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create .env for compose validation
        if: steps.gate.outputs.skip != 'true'
        run: |
          cp .env.example .env
          # El servicio ivr del spike (#172) está detrás de profiles: ["ivr"] y
          # nunca se levanta por defecto, pero `docker compose config` interpola
          # TODOS los servicios, incluidos los de un profile inactivo. Su
          # IVR_ARI_PASSWORD usa la forma ${VAR:?...}, así que sin valor este job
          # falla aunque el servicio no corra. Se inyecta un placeholder: el job
          # valida sintaxis, no credenciales, y el guard sigue intacto para quien
          # levante el profile de verdad.
          echo 'IVR_ARI_PASSWORD=ci-placeholder-no-usar' >> .env

      - name: Validate dev compose
        if: steps.gate.outputs.skip != 'true'
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate prod compose
        if: steps.gate.outputs.skip != 'true'
        env:
          OPENWA_API_KEY: ci-placeholder-key
          OPENWA_WEBHOOK_SECRET: ci-placeholder-secret
          OPENWEATHERMAP_API_KEY: ci-placeholder-key
          ADMIN_API_KEY: ci-placeholder-key
          PHONE_HASH_PEPPER: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
        run: docker compose -f docker-compose.prod.yml config --quiet
