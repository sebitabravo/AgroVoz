          disminución de 4,3% alcanzando $1.078 por kilo.

  - titulo: "ODEPA — Contexto Agricultura Familiar Campesina"
    fuente: "ODEPA — Estudios"
    fecha: "2024"
    url: "https://www.odepa.gob.cl"
    chunks:
      - texto: >
          La agricultura chilena ha mostrado una transformación notable
          en las últimas décadas. El sector agroalimentario y forestal
          se ha constituido como uno de los pilares del desarrollo
          económico del país. La pequeña agricultura enfrenta
          importantes desafíos para lograr su plena integración.
      - texto: >
          INDAP ha sido un actor clave de la política sectorial,
          alcanzando una cobertura de más de 185.000 productores,
          atendidos a través de 103 Oficinas de Área localizadas en
          todo el territorio nacional. Los pequeños agricultores
          pueden acceder a instrumentos de fomento como PROCHILE,
          FIA, INIA, SAG, Ley Forestal, Ley de Riego y BancoEstado.
      - texto: >
          El 40% del precio mayorista se pierde por asimetría de
          información cuando los pequeños agricultores negocian con
          intermediarios. Acceder a información de precios ODEPA en
          tiempo real permite a los agricultores negociar mejor y
          obtener un precio más justo por sus productos.
