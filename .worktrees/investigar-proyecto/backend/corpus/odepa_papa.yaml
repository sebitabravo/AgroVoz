          El precio promedio mensual para mercado mayorista de la papa
          en noviembre 2025 presentó una disminución de 3,5% respecto
          a septiembre del presente año, llegando a $5.995 por saco
          de 25 kilos. Al comparar noviembre de 2025 respecto al
          mismo mes del año anterior, se observa una disminución del
