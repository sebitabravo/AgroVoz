# Corpus ODEPA — Boletín de la Papa
# Fuente: https://www.odepa.gob.cl/publicaciones/boletines
# Autor: Adriana Valenzuela Palma, ODEPA
#
# Cada entrada representa un chunk de contenido factual de boletines
# oficiales de precios y comercio de papa. Solo datos, sin recomendaciones
# agronómicas. Usado por RAGCorpus para retrieval con TF-IDF.
documentos:
  - titulo: "Boletín de la papa, junio 2026"
    fuente: "ODEPA — Boletín de la papa"
    fecha: "junio 2026"
    url: "https://www.odepa.gob.cl/publicaciones/boletines/boletin-de-la-papa-junio-2026"
    chunks:
      - texto: >
          El precio promedio mensual para mercado mayorista de la papa
          en mayo 2026 disminuyó 2,1% respecto al mes anterior,
          llegando a $9.890 por saco de 25 kilos con IVA incluido.
          Al comparar mayo de 2026 respecto al mismo mes del año
          anterior, se observa un aumento del precio en 41%.
      - texto: >
          A nivel de consumidor en la Región Metropolitana, el precio
          promedio por kilo durante mayo 2026 en ferias se mantuvo
          similar al mes anterior, pasando de $699 a $700 por kilo
          promedio mensual. En supermercados, el aumento del precio
          fue de 3%, pasando de $1.508 a $1.553 por kilo.
      - texto: >
          Al comparar mayo de 2026 versus 2025, el precio de la papa
          promedio por kilo aumentó 17,4% en ferias libres y 2% en
          supermercados. La papa se cultiva comercialmente desde la
          Región de Coquimbo a Los Lagos, destacando la zona sur como
          principal zona productora.
      - texto: >
          El alza de precios respecto al mes anterior se explica
          principalmente por una disminución en los volúmenes
          ingresados a los mercados mayoristas, provenientes de las
          regiones de La Araucanía a Los Lagos, ya que está
          finalizando la cosecha. A esto se suma el efecto de mayores
          costos de transporte asociados al alza de combustibles.

  - titulo: "Boletín de la papa, mayo 2026"
    fuente: "ODEPA — Boletín de la papa"
    fecha: "mayo 2026"
    url: "https://www.odepa.gob.cl/publicaciones/boletines/boletin-de-la-papa-mayo-2026"
    chunks:
      - texto: >
          El precio promedio mensual para mercado mayorista de la papa
          en abril 2026 presentó un aumento de 13,6% respecto a marzo
          del presente año, llegando a $10.102 por saco de 25 kilos.
          Al comparar abril de 2026 respecto al mismo mes del año
          anterior, se observa un aumento del precio en 54%.
      - texto: >
          A nivel de consumidor en la Región Metropolitana, el precio
          promedio por kilo durante abril 2026 en ferias aumentó 11%,
          pasando de $630 a $699 por kilo promedio mensual. En
          supermercados, el aumento fue de 5,6%, pasando de $1.427 a
          $1.508 por kilo. En supermercados en línea, el precio
          alcanzó $1.536 por kilo.
      - texto: >
          Al comparar abril de 2026 versus 2025, el precio de la papa
          promedio por kilo aumentó 19,5% en ferias libres y
          disminuyó 9,3% en supermercados. El análisis se realiza
          sobre la base de precios nominales, considerando el
          promedio mensual por volumen en sacos de 25 kilos.

  - titulo: "Boletín de la papa, marzo 2026"
    fuente: "ODEPA — Boletín de la papa"
    fecha: "marzo 2026"
    url: "https://www.odepa.gob.cl/publicaciones/boletines/boletin-de-la-papa-marzo-2026"
    chunks:
      - texto: >
          El precio promedio mensual para mercado mayorista de la papa
          en febrero 2026 presentó una disminución de 2,6% respecto a
          enero del presente año, llegando a $7.667 por saco de 25
          kilos. Al comparar febrero de 2026 respecto al mismo mes
          del año anterior, se observa un aumento del precio en 23,7%.
      - texto: >
          Durante los meses de enero y febrero de 2026 los precios
          nominales de la papa se mantuvieron estables, siguiendo la
          tendencia del año 2024. A nivel de consumidor en la Región
          Metropolitana, en ferias el precio subió 3,6%, pasando de
          $569 a $589 por kilo promedio mensual.
      - texto: >
          En supermercados, el aumento del precio promedio de la papa
          en febrero 2026 respecto a enero alcanzó 4,9%, pasando de
          $1.214 a $1.273 por kilo. En supermercados en línea, se
          presentó un aumento de 12,2% respecto al mes anterior,
          alcanzando $1.365 por kilo.

