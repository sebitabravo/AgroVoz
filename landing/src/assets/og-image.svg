<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2ed"/>
      <stop offset="1" stop-color="#fbfaf7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- halos decorativos -->
  <circle cx="1010" cy="120" r="230" fill="#4f7d5a" opacity="0.08"/>
  <circle cx="150" cy="580" r="170" fill="#3c6446" opacity="0.06"/>

  <!-- eyerbrow pill -->
  <g transform="translate(122,120)">
    <rect x="0" y="0" width="470" height="46" rx="23" fill="#ffffff" stroke="#e8e7e0"/>
    <circle cx="26" cy="23" r="7" fill="#4f7d5a"/>
    <text x="48" y="30" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#1c1e1a">Precios y clima por voz · en WhatsApp</text>
  </g>

  <!-- waveform (logo) -->
  <g transform="translate(122,250)">
    <rect x="0" y="52" width="26" height="96" rx="7" fill="#4f7d5a"/>
    <rect x="46" y="0" width="26" height="200" rx="7" fill="#3c6446"/>
    <rect x="92" y="30" width="26" height="140" rx="7" fill="#4f7d5a"/>
  </g>

  <!-- nombre -->
  <text x="278" y="402" font-family="Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" fill="#1c1e1a" letter-spacing="-3">AgroVoz</text>

  <!-- tagline -->
  <text x="122" y="500" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="600" fill="#3c6446">El agricultor pregunta. AgroVoz responde con datos oficiales.</text>

  <!-- footer -->
  <text x="122" y="568" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#4f7d5a" letter-spacing="1.5">INACAP TEMUCO · DESAFÍO CREA INACAP 2026</text>
</svg>
