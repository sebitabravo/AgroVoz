# AgroVoz — Docker Compose para PRODUCCIÓN (Dokploy)
#
# Dokploy deploya este compose automáticamente al detectar cambios en main.
# El VPS de este server Dokploy corre Pangolin (gerbil+traefik+crowdsec) como
# ingress — Pangolin reserva 80/443 del host y hace el reverse proxy + SSL
# Let's Encrypt, NO el Traefik propio de Dokploy (deshabilitado a propósito
# en este server para no competir por los mismos puertos).
#
# REGLAS DOKPLOY + PANGOLIN (actualiza decisión #12):
#   - `backend` NO publica ningún puerto al host (`expose` únicamente) — se une
#     además a la red externa `pangolin` (gerbil/traefik/crowdsec) con el alias
#     `agrovoz-backend`, así Traefik lo alcanza por nombre de contenedor dentro
#     de esa red. IMPORTANTE: `127.0.0.1` dentro de un contenedor es SIEMPRE su
#     propio loopback, nunca el del host — publicar en loopback del host NO
#     sirve para que otro contenedor (Traefik) lo alcance.
#   - El dominio público se configura como Resource en Pangolin, Target
#     apuntando al hostname `agrovoz-backend` puerto 8000 (no IP ni loopback),
#     no en la sección Domains de Dokploy.
#   - NO definir `container_name` (Dokploy gestiona los nombres) — por eso el
#     alias de red explícito, en vez de depender del nombre real del contenedor.
#   - Red externa `dokploy-network` (`external: true`) — sigue usándose para
#     el descubrimiento interno backend↔openwa, no para el ingress público.
#   - Variables de entorno via Secrets UI de Dokploy (NO .env commiteado).
#     Cada ${VAR} en `environment:` lo inyecta Dokploy desde su vault de secrets.
#     Referencia: .env.production.example para ver TODAS las variables a configurar.
#
# Dashboard de Open-WA (puerto 2886) NO se expone públicamente.
# Para escanear QR por primera vez:
#   ssh -L 2886:localhost:2886 root@<vps-ip>
#   Luego abrir http://localhost:2886 y escanear QR con WhatsApp.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # ── Entorno ──────────────────────
      - APP_ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONDONTWRITEBYTECODE=1       # Sin .pyc en filesystem read-only
      # ── Base de datos ────────────────
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/agrovoz.db}
      # ── Secrets — Dokploy Secrets UI ──
      - OPENWA_API_KEY=${OPENWA_API_KEY:?OPENWA_API_KEY requerida — configurar en Dokploy Secrets UI}
      - OPENWA_WEBHOOK_SECRET=${OPENWA_WEBHOOK_SECRET:?OPENWA_WEBHOOK_SECRET requerido — configurar en Dokploy Secrets UI}
      - OPENWA_API_URL=http://openwa:2785
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      # Secret para firmar cookies de sesión del dashboard SSR (itsdangerous).
      # Sin esto el backend arranca con default y validate_admin_keys_not_default
      # bloquea el arranque en producción.
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
      # ── Features post-MVP (fail-closed) ──
      - MCP_ENABLED=${MCP_ENABLED:-false}
      - MCP_API_KEY=${MCP_API_KEY:-}
      - MCP_ADMIN_KEY=${MCP_ADMIN_KEY:-}
      - USE_CONVERSATION_STATE=${USE_CONVERSATION_STATE:-false}
      - CONVERSATION_TIMEOUT_MINUTES=${CONVERSATION_TIMEOUT_MINUTES:-30}
      - CONSULTATION_HISTORY_ENABLED=${CONSULTATION_HISTORY_ENABLED:-false}
      - CONSULTATION_HISTORY_TTL_DAYS=${CONSULTATION_HISTORY_TTL_DAYS:-28}
      - CONSULTATION_HISTORY_AUDIT_KEY=${CONSULTATION_HISTORY_AUDIT_KEY:-}
      - EXPENSE_TRACKING_ENABLED=${EXPENSE_TRACKING_ENABLED:-false}
      - EXPENSE_RETENTION_DAYS=${EXPENSE_RETENTION_DAYS:-180}
      - PARCELA_TRACKING_ENABLED=${PARCELA_TRACKING_ENABLED:-false}
      - PARCELA_RETENTION_DAYS=${PARCELA_RETENTION_DAYS:-365}
      - AGRONOMIC_RULES_ENABLED=${AGRONOMIC_RULES_ENABLED:-false}
      - FARMER_PANEL_ENABLED=${FARMER_PANEL_ENABLED:-false}
      - PANEL_LINK_SECRET=${PANEL_LINK_SECRET:-}
      - PANEL_LINK_TTL_HOURS=${PANEL_LINK_TTL_HOURS:-24}
      - PANEL_BASE_URL=${PANEL_BASE_URL:-}
      - AGRONOMIST_CONSOLE_ENABLED=${AGRONOMIST_CONSOLE_ENABLED:-false}
      - AGRONOMIST_LINK_SECRET=${AGRONOMIST_LINK_SECRET:-}
      - AGRONOMIST_LINK_TTL_HOURS=${AGRONOMIST_LINK_TTL_HOURS:-72}
      - AGRONOMIST_BASE_URL=${AGRONOMIST_BASE_URL:-}
      # ── Modelos IA (paths dentro del contenedor) ──
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_BACKEND=${WHISPER_BACKEND:-faster}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - LLM_MODEL_PATH=${LLM_MODEL_PATH:-/app/models/qwen2.5-3b-q4_k_m.gguf}
      - PIPER_VOICE=${PIPER_VOICE:-es_MX-claude-high}
      - PIPER_MODEL_PATH=${PIPER_MODEL_PATH:-/app/models/es_MX-claude-high.onnx}
      # ── ODEPA ────────────────────────
      - ODEPA_SYNC_HOUR=${ODEPA_SYNC_HOUR:-6}
      - ODEPA_SYNC_MINUTE=${ODEPA_SYNC_MINUTE:-0}
      # ── Seguridad ────────────────────
      - PHONE_HASH_PEPPER=${PHONE_HASH_PEPPER}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - AUDIO_RETENTION_HOURS=${AUDIO_RETENTION_HOURS:-24}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # TrustedHostMiddleware (app/core/security.py) solo permite agrovoz.cl
      # por defecto. Este server usa agrovoz.sbravo.app (ver #306) -- sin
      # esto el backend responde 400 "Invalid host header" a todo trafico
      # real por Pangolin, aunque el healthcheck interno (localhost) pase.
      - EXTRA_ALLOWED_HOSTS=${EXTRA_ALLOWED_HOSTS:-}
      # CORSMiddleware (app/main.py) solo permite agrovoz.cl/www.agrovoz.cl
      # por defecto. La landing real de este deploy esta en un subdominio
      # distinto (landing.sbravo.app) -- sin esto, el fetch del demo desde
      # la landing pasa el 404/400 previos pero lo bloquea el navegador
      # por CORS antes de llegar a la respuesta.
      - CORS_ORIGINS=${CORS_ORIGINS:-https://agrovoz.cl,https://www.agrovoz.cl}
      # Apagado por diseño en produccion (ver comentario en config.py:
      # "evitar abuso del LLM/TTS"). Default false preservado -- activarlo
      # es decision de producto/costo, no un fix de infra.
      - DEMO_ENDPOINT_ENABLED=${DEMO_ENDPOINT_ENABLED:-false}
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]
    volumes:
      - backend_models:/app/models    # Modelos IA (Piper + Qwen GGUF)
      - backend_data:/app/data        # SQLite DB + audio temporal
      - backend_whisper_cache:/home/agrovoz/.cache  # Cache Whisper (FS read-only)
    expose:
      - "8000"                        # Solo entre contenedores — nunca publicado al host
    networks:
      dokploy-network: {}             # Red interna: descubrimiento backend↔openwa
      pangolin:                       # Misma red que gerbil/traefik: permite que
        aliases:                      # Pangolin llegue al backend por nombre estable
          - agrovoz-backend           # (evita depender del container name random de Dokploy)
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/v1/health?probe=liveness",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # 10 min: primer arranque descarga Piper (~63 MB) + Qwen GGUF (~2 GB) +
      # Whisper small (~462 MB) si no estan en el volumen. Arranques siguientes
      # son instantaneos (modelos cacheados en el volumen).
      start_period: 600s
    logging:
      driver: json-file
      options:
        # Tope de disco, no TTL temporal: la política de conservación y su
        # verificación operativa siguen pendientes de aprobación.
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        # cpus limit tope al hardware real del VPS Hostinger (4 vCPU totales,
        # compartidos con ollama/pangolin en el mismo host) — no al piso 8
        # vCPU del Hetzner CX43 planeado originalmente en #9. Docker rechaza
        # cualquier limite de CPU por encima del total de nucleos del host.
        limits:
          memory: 8G
          cpus: "3"
        reservations:
          memory: 4G
          cpus: "2"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # Open-WA: gateway WhatsApp self-hosted
  openwa:
    # ⚠️  PENDIENTE: Reemplazar :latest por digest SHA256 después del primer pull:
    #   docker pull ghcr.io/rmyndharis/openwa:latest
    #   docker inspect ghcr.io/rmyndharis/openwa:latest --format='{{index .RepoDigests 0}}'
    #   Reemplazar la línea de abajo con: image: ghcr.io/rmyndharis/openwa@sha256:<digest>
    #   Esto previene supply chain attacks via tag mutability.
    image: ghcr.io/rmyndharis/openwa:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_TYPE=sqlite
      - ALLOW_DEV_API_KEY=false
      - API_MASTER_KEY=${OPENWA_API_KEY}
      - AUTO_START_SESSIONS=true
      - WEBHOOK_URL=http://backend:8000/api/v1/webhook/whatsapp
      - WEBHOOK_SECRET=${OPENWA_WEBHOOK_SECRET}
    volumes:
      - openwa_data:/app/data         # Sesión WhatsApp persiste entre reinicios
    expose:
      - "2785"                        # API interna (solo backend accede)
    networks:
      - dokploy-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # curl no está garantizado en la imagen Open-WA (basada en Node.js).
      # Usamos node -e con http.get para healthcheck sin dependencias externas.
      # La imagen escucha en puerto 2785 internamente (v0.4.0+).
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2785/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        # Open-WA es un tercero local: limitar también sus logs aunque su
        # contenido exacto dependa de la imagen desplegada.
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN     # el entrypoint hace chown de /app/data al arrancar
      - SETUID    # despues baja de root al usuario "openwa" (gosu/su-exec)
      - SETGID    # ambos fallan con "Operation not permitted" sin estos caps
    security_opt:
      - no-new-privileges:true

volumes:
  backend_models:
  backend_data:
  backend_whisper_cache:
  openwa_data:

networks:
  dokploy-network:
    external: true                    # Creada por Dokploy automáticamente
  pangolin:
    external: true                    # Red de Pangolin (gerbil/traefik) en este VPS —
                                       # backend se une para ser alcanzable como ingress,
                                       # 127.0.0.1 del contenedor NO es el localhost del host
